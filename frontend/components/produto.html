<div class="card">


<h2>
Cadastro de Produto
</h2>



<div class="form-grid">



<div class="form-group">

<label>
Código Produto
</label>


<input

id="component_codigo_produto"

type="text">


</div>




<div class="form-group">

<label>
Nome Produto
</label>


<input

id="component_nome_produto"

type="text">


</div>




<div class="form-group">

<label>
Categoria
</label>


<input

id="component_categoria_produto"

type="text">


</div>




<div class="form-group">

<label>
Unidade
</label>


<select

id="component_unidade_produto">


<option>
UN
</option>


<option>
CX
</option>


<option>
KG
</option>


<option>
LT
</option>


</select>


</div>




<div class="form-group">

<label>
Preço Revenda
</label>


<input

id="component_preco_revenda"

type="number"

step="0.01">


</div>




<div class="form-group">

<label>
Preço Consumidor
</label>


<input

id="component_preco_consumidor"

type="number"

step="0.01">


</div>




<div class="form-group">

<label>
Estoque Inicial
</label>


<input

id="component_estoque_inicial"

type="number">


</div>




<div class="form-group">

<label>
Estoque Mínimo
</label>


<input

id="component_estoque_minimo"

type="number">


</div>



</div>



<br>



<button

class="btn-success"

onclick="salvarProdutoComponente()">

Salvar Produto

</button>



</div>
