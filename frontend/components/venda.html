<div class="card">


<h2>
Novo Pedido YES FREE
</h2>



<div class="form-grid">



<div class="form-group">

<label>
Tipo Venda
</label>


<select id="component_tipo_venda">


<option>
VENDA
</option>


<option>
ORÇAMENTO
</option>


<option>
CONSIGNADO
</option>


<option>
PAGAMENTO
</option>


</select>


</div>



<div class="form-group">

<label>
Cliente
</label>


<input

id="component_cliente_venda"

placeholder="Buscar cliente">


<div id="clientes_resultado">

</div>


</div>



</div>



<hr>



<h3>
Produtos
</h3>



<div class="form-grid">



<div class="form-group">

<label>
Produto
</label>


<input

id="component_produto_venda"

placeholder="Buscar produto">


<div id="produtos_resultado">

</div>


</div>




<div class="form-group">

<label>
Quantidade
</label>


<input

id="component_quantidade_venda"

type="number"

value="1">


</div>



</div>



<button

class="btn-primary"

onclick="adicionarProdutoVendaComponente()">

Adicionar Produto

</button>




<br><br>



<table id="tabela_itens_venda">


<thead>


<tr>

<th>
Produto
</th>

<th>
Quantidade
</th>

<th>
Valor Unitário
</th>

<th>
Total
</th>

<th>
Excluir
</th>


</tr>


</thead>


<tbody>


</tbody>


</table>



<br>



<div class="form-grid">



<div class="form-group">

<label>
Desconto
</label>


<input

id="component_desconto_venda"

type="number"

value="0"

onchange="calcularVendaComponente()">


</div>




<div class="form-group">

<label>
Frete
</label>


<input

id="component_frete_venda"

type="number"

value="0"

onchange="calcularVendaComponente()">


</div>




<div class="form-group">

<label>
Cupom Desconto
</label>


<input

id="component_cupom_venda"

type="number"

value="0"

onchange="calcularVendaComponente()">


</div>




<div class="form-group">

<label>
Comissão
</label>


<input

id="component_comissao_venda"

type="number"

value="0">


</div>



</div>




<h2>

Total:

<span id="component_total_venda">

R$ 0,00

</span>


</h2>




<div>


<button

class="btn-success"

onclick="salvarVendaComponente()">

Salvar Pedido

</button>




<button

class="btn-primary"

onclick="gerarPDFVendaComponente()">

Gerar PDF

</button>




<button

class="btn-danger"

onclick="cancelarVendaComponente()">

Cancelar

</button>


</div>


</div>
